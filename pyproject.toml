[project]
name = "soilvision-ai-backend"
version = "1.0.0"
description = "SoilVision AI FastAPI ML inference service for Vercel Python runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9",
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "Pillow>=10,<13",
    "opencv-python-headless>=4.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0,<2",
]

[tool.vercel]
entrypoint = "backend.app:app"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
